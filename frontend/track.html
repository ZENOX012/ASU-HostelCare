<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Ticket Tracking — ASU HostelCare</title>
  <link rel="stylesheet" href="/frontend/css/theme.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <link rel="stylesheet" href="/frontend/css/track.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 2rem; border-bottom: 1px solid var(--card-border); background: var(--navy-900);">
    <div style="display: flex; align-items: center; gap: 0.85rem;">
      <a href="/"><img src="/frontend/assets/logo.png" alt="Apeejay Stya University Logo" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--gold-400); background: #ffffff;"></a>
      <div>
        <h3 style="font-family: var(--font-academic); font-size: 1.1rem;">APEEJAY STYA UNIVERSITY</h3>
        <span style="font-size: 0.72rem; color: var(--gold-400);">HOSTELCARE GRIEVANCE VERIFIER</span>
      </div>
    </div>
    <div>
      <a href="/login.html" class="btn btn-primary btn-sm">Sign In</a>
    </div>
  </header>

  <main class="track-page-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 class="gold-text" style="font-size: 2rem; margin-bottom: 0.5rem;">Track Complaint Resolution</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Verify progress, assigned tradesperson, and GPS-tagged completion proof in real-time.
      </p>
    </div>

    <!-- Search Input Box -->
    <div class="academic-panel" style="margin-bottom: 2rem;">
      <form id="track-search-form" onsubmit="handleTrackSearch(event)" style="display: flex; gap: 0.75rem;">
        <input type="text" id="track-code-input" class="form-input" placeholder="Enter Reference Code (e.g. ASU-2026-0812)" required style="font-family: monospace; font-size: 1rem; text-transform: uppercase;">
        <button type="submit" id="track-btn" class="btn btn-primary" style="white-space: nowrap;">Search Ticket</button>
      </form>
    </div>

    <!-- Result Display Container -->
    <div id="track-result" style="display: none;">
      <!-- Content populated by JavaScript -->
    </div>

    <div id="track-empty-state" style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
      <p>Enter your 12-character complaint code above to inspect status and proof.</p>
    </div>
  </main>

  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/common.js"></script>
  <script>
    const STAGE_ORDER = ["Submitted", "Assigned", "In Progress", "Awaiting Confirmation", "Resolved"];

    function renderStepTracker(currentStatus) {
      let activeIndex = STAGE_ORDER.indexOf(currentStatus);
      if (activeIndex === -1) activeIndex = 0;

      return `
        <div class="step-tracker">
          ${STAGE_ORDER.map((stage, idx) => {
            let itemClass = "";
            if (idx < activeIndex) itemClass = "completed";
            else if (idx === activeIndex) itemClass = "active";

            return `
              <div class="step-item ${itemClass}">
                <div class="step-circle">${idx < activeIndex ? "✓" : idx + 1}</div>
                <div class="step-label">${stage}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function fetchTicket(code) {
      const resultDiv = document.getElementById("track-result");
      const emptyDiv = document.getElementById("track-empty-state");
      const btn = document.getElementById("track-btn");

      btn.disabled = true;
      btn.textContent = "Fetching...";

      try {
        const ticket = await apiFetch(`/api/complaints/track/${encodeURIComponent(code)}`);

        emptyDiv.style.display = "none";
        resultDiv.style.display = "block";

        let workerInfo = "Awaiting Assignment";
        if (ticket.worker) {
          workerInfo = `${ticket.worker.full_name} (${ticket.worker.worker_specialization || "Staff"}, ${ticket.worker.worker_shift || "Day"} Shift)`;
        }

        let gpsBadge = "";
        if (ticket.completion_lat && ticket.completion_lng) {
          gpsBadge = `
            <div style="margin-top: 0.75rem;">
              <span class="gps-pill">
                📍 GPS Verified: ${ticket.completion_lat.toFixed(5)}°, ${ticket.completion_lng.toFixed(5)}° (±${ticket.completion_accuracy ? ticket.completion_accuracy.toFixed(0) : 5}m)
              </span>
            </div>
          `;
        }

        let proofPhotoHtml = "";
        if (ticket.completion_photo) {
          proofPhotoHtml = `
            <div style="margin-top: 1rem;">
              <h5 style="color: var(--gold-400); margin-bottom: 0.35rem;">Staff Geo-Tagged Proof Photo</h5>
              <div class="proof-image-box">
                <a href="${ticket.completion_photo}" target="_blank" title="Click to view full photo">
                  <img src="${ticket.completion_photo}" alt="Completion Proof">
                </a>
              </div>
              ${gpsBadge}
            </div>
          `;
        }

        let ratingHtml = "";
        if (ticket.student_rating) {
          ratingHtml = `
            <div style="margin-top: 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 6px; padding: 0.75rem 1rem;">
              <div style="font-weight: 600; color: #4ade80;">Student Satisfaction Rating: ${"★".repeat(ticket.student_rating)}${"☆".repeat(5 - ticket.student_rating)} (${ticket.student_rating}/5)</div>
              ${ticket.student_feedback ? `<div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Feedback: "${ticket.student_feedback}"</div>` : ""}
            </div>
          `;
        }

        let timelineHtml = (ticket.timeline || []).map(tl => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-header">
              <div class="timeline-title">${tl.status}</div>
              <div class="timeline-time">${formatDate(tl.created_at)}</div>
            </div>
            <div class="timeline-body">
              <strong>${tl.action_by_name || 'System'}:</strong> ${tl.notes || 'Status updated.'}
            </div>
          </div>
        `).join("");

        resultDiv.innerHTML = `
          <div class="academic-panel" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
              <div>
                <span style="font-family: monospace; font-size: 1.1rem; color: var(--gold-400); font-weight: 700;">${ticket.complaint_code}</span>
                <h2 style="font-size: 1.4rem; margin-top: 0.35rem;">${ticket.title}</h2>
                <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
                  Category: <span style="color: var(--text-primary); font-weight: 600;">${ticket.category}</span> &bull; Filed: ${formatDate(ticket.created_at)}
                </div>
              </div>
              <div style="display: flex; gap: 0.5rem; align-items: center;">
                ${getPriorityBadge(ticket.priority)}
                ${getStatusBadge(ticket.status)}
              </div>
            </div>

            <!-- Step Tracker -->
            ${renderStepTracker(ticket.status)}

            <div style="background: rgba(9, 18, 32, 0.7); border-radius: 6px; padding: 1.25rem; margin-top: 1.5rem;">
              <h5 style="color: var(--gold-400); margin-bottom: 0.4rem;">Description of Issue</h5>
              <p style="color: var(--text-secondary); font-size: 0.92rem; line-height: 1.5;">${ticket.description}</p>
              
              <div style="margin-top: 1rem; display: flex; gap: 2rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted);">
                <div><strong>Assigned Tradesperson:</strong> <span style="color: var(--text-primary);">${workerInfo}</span></div>
                <div><strong>Location:</strong> <span style="color: var(--text-primary);">${ticket.student ? `Block ${ticket.student.hostel_block}, Room ${ticket.student.room_number}` : "Campus Facility"}</span></div>
              </div>

              ${proofPhotoHtml}
              ${ratingHtml}
            </div>
          </div>

          <!-- Timeline of actions -->
          <div class="academic-panel">
            <h4 style="color: var(--gold-400); margin-bottom: 1rem;">Official Resolution Log & Audited Timeline</h4>
            <div class="timeline-container">
              ${timelineHtml}
            </div>
          </div>
        `;

      } catch (err) {
        showToast(err.message, "error");
        emptyDiv.innerHTML = `<p style="color:#f87171;">⚠️ ${err.message}</p>`;
        emptyDiv.style.display = "block";
        resultDiv.style.display = "none";
      } finally {
        btn.disabled = false;
        btn.textContent = "Search Ticket";
      }
    }

    function handleTrackSearch(e) {
      e.preventDefault();
      const code = document.getElementById("track-code-input").value.trim();
      if (code) {
        fetchTicket(code);
      }
    }

    // Auto-search if code query parameter exists
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      if (code) {
        document.getElementById("track-code-input").value = code;
        fetchTicket(code);
      }
    });
  </script>
</body>
</html>
