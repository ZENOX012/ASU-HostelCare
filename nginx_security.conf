# ==============================================================================
# ASU HostelCare — Nginx Security Directives
# Include this file in your server block or copy these rules to /etc/nginx/sites-available/
# ==============================================================================

# 1. Disable Directory Listing
autoindex off;

# 2. Block Hidden Files (.git, .env, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 403;
}

# 3. Block Backend, Database, Python source and Archives
location ~* \.(py|pyc|env|db|sqlite|sqlite3|sql|zip|tar|gz|rar|7z|bak|log|sh|bat|yaml|yml)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 403;
}

# 4. Block Backend Directory Traversal
location ^~ /backend/ {
    deny all;
    return 403;
}

# 5. Reverse Proxy to FastAPI Uvicorn
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Defensive Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
